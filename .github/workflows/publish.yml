name: Publish to PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --no-editable: install the built wheel instead of uv's default
      # editable install, so packaging bugs (file missing from the wheel)
      # surface here, before publish.
      # OLD: pip install . --group dev
      - name: Install dependencies
        run: uv sync --all-groups --no-editable

      # OLD: python -m pytest
      - name: Run tests
        run: uv run pytest

  publish:
    runs-on: ubuntu-latest
    needs: [test]
    environment: pypi

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Same as: pip install build && python -m build — both drive the
      # backend from pyproject.toml to produce dist/*.whl + dist/*.tar.gz.
      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
